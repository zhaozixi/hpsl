{% extends "base.html" %}
{% from "macros.html" import help_banner %}
{% block title %}HPSL · 新建项目{% endblock %}
{% block content %}
<h1>新建项目</h1>

{{ help_banner("新建一个学习项目",
   "项目就是你想要学会的一件事。起个名字、写清目标，就可以开始。后续系统会帮你把目标拆成小单元。") }}

<form id="create-form" class="card" hx-post="/api/v1/projects" hx-target="#result" hx-swap="innerHTML">
  <p><label>名称<br><input class="input" name="name" required maxlength="100" size="40" placeholder="例如：Python 数据分析入门"></label></p>
  <p><label>目标<br><textarea class="textarea" name="goal" required maxlength="500" rows="3" cols="60" placeholder="例如：能独立完成一份数据分析报告"></textarea></label></p>
  <p><label>初版认识（可选）<br><textarea class="textarea" name="initial_belief" maxlength="2000" rows="4" cols="60" placeholder="你对这个主题目前的了解，学完后再回头看会很有意思"></textarea></label></p>
  <button type="submit" class="btn btn-primary">创建</button>
</form>
<div id="result"></div>
<p><a href="/">返回列表</a></p>

<script nonce="{{ request.state.csp_nonce if request is defined else '' }}">
// M36/P1-B7：创建成功后自动调用 POST /api/v1/projects/{newId}/switch，
// 写入 config.last_active_at（B7：此前只有 switch 会写，重启后恢复不到新项目），
// 切换成功再进入 /unit。newId 由服务端 HTMX 片段上的 data-project-id 提供。
function hpslAfterCreate() {
  var box = document.getElementById('result');
  var node = box ? box.querySelector('[data-project-id]') : null;
  var pid = node ? node.getAttribute('data-project-id') : '';
  if (!pid) return;  // 创建失败：错误片段已显示在 #result，不误跳转
  if (window.hpslSwitchProject) { window.hpslSwitchProject(pid, null); return; }
  // 兜底（app.js 未加载时）：内联 fetch + CSRF 双提交
  var m = document.cookie.match(/(?:^|; )hpsl_csrf=([^;]+)/);
  var token = m ? decodeURIComponent(m[1]) : '';
  fetch('/api/v1/projects/' + encodeURIComponent(pid) + '/switch', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': token },
    body: '{}'
  }).then(function (r) { return r.json(); }).then(function (d) {
    if (d && d.code === '0') { window.location.href = '/unit'; return; }
    if (window.hpslToast) { window.hpslToast('切换失败：' + ((d && d.msg) || '未知错误')); }
  }).catch(function () {
    if (window.hpslToast) { window.hpslToast('切换失败：网络或服务异常'); }
  });
}
</script>
{% endblock %}
