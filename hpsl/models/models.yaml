# HPSL 模型注册表（用户可维护）。M4 仅读取以下字段：
#   id / provider / family / derived_from / supports_json / is_fallback_for
# - family：模型族（同源判定依据之一）。
# - derived_from：若模型源于某族（如蒸馏/微调），填被源族名（同源判定依据之二）。
# - supports_json：是否原生支持结构化响应（OpenAI 兼容走 response_format；
#   Anthropic 走 tool-use 等价路径）。
# - is_fallback_for：声明本模型可作为哪个 provider 的备选（BD-01 不静默切换，
#   备选选择由上层/CLI 明示）。
#
# providers 字段（M22 扩展）：
#   display：人读展示名（向导下拉 / 设置页）。
#   kind：接入协议类别，决定适配器与连通性探活分支，取值：
#       openai_compat | anthropic | gemini
#   base_url：该厂商默认接入点（密钥经 secrets 模块存储，不进 project.db）。
# 新增国内外常见大模型时，只需在此追加 provider + 对应 models 条目，
# 向导下拉 / 密钥存储 / 连通性测试将自动覆盖（无需改路由代码）。

providers:
  openai:
    display: OpenAI（GPT 系列）
    kind: openai_compat
    base_url: https://api.openai.com/v1
  anthropic:
    display: Anthropic（Claude 系列）
    kind: anthropic
    base_url: https://api.anthropic.com/v1
  gemini:
    display: Google Gemini
    kind: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
  deepseek:
    display: DeepSeek（深度求索）
    kind: openai_compat
    base_url: https://api.deepseek.com/v1
  qwen:
    display: 通义千问（阿里云 DashScope）
    kind: openai_compat
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  zhipu:
    display: 智谱 GLM（ChatGLM）
    kind: openai_compat
    base_url: https://open.bigmodel.cn/api/paas/v4
  moonshot:
    display: Moonshot（Kimi）
    kind: openai_compat
    base_url: https://api.moonshot.cn/v1
  doubao:
    display: 豆包（字节火山方舟）
    kind: openai_compat
    base_url: https://ark.cn-beijing.volces.com/api/v3

