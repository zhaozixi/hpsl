# HPSL 模型注册表（用户可维护）。
#   id / provider / family / derived_from / supports_json / is_fallback_for
# - family：模型族（同源判定依据之一）。
# - derived_from：若模型源于某族（如蒸馏/微调），填被源族名（同源判定依据之二）。
# - supports_json：是否原生支持结构化响应（走 response_format）。
# - is_fallback_for：声明本模型可作为哪个 provider 的备选（BD-01 不静默切换，
#   备选选择由上层/CLI 明示）。
#
# providers 字段：
#   display：人读展示名（向导下拉 / 设置页）。
#   kind：接入协议类别，决定适配器与连通性探活分支，取值：
#       openai_compat | anthropic | gemini
#   base_url：该厂商默认接入点（密钥经 secrets 模块存储，不进 project.db）。
#
# ⚠️ 启用范围（2026-10 起）：**仅国内三家厂商** —— DeepSeek / 通义千问 / 智谱 GLM，
#    统一走 openai_compat 协议。OpenAI / Anthropic / Gemini / Moonshot / 豆包
#    已从本表移除（向导与设置页不再出现，pick_default_model 也不会选中）。
#    anthropic / gemini 适配器代码仍保留在 models/ 下（协议分支未删），
#    如需重新启用某家厂商，只需在此追加 provider 与 models 条目，无需改路由代码。

providers:
  deepseek:
    display: DeepSeek（深度求索）
    kind: openai_compat
    base_url: https://api.deepseek.com/v1
  qwen:
    display: 千问 Qwen（MaaS）
    kind: openai_compat
    base_url: https://maas.qianwenaiapi.com/compatible-mode/v1
  zhipu:
    display: 智谱 GLM（ChatGLM）
    kind: openai_compat
    base_url: https://open.bigmodel.cn/api/paas/v4

models:
  # —— DeepSeek ——
  - id: deepseek-flash
    provider: deepseek
    family: deepseek
    derived_from: null
    supports_json: true
    is_fallback_for: null
  - id: deepseek-v4-pro
    provider: deepseek
    family: deepseek
    derived_from: null
    supports_json: true
    is_fallback_for: null
  - id: deepseek-chat
    provider: deepseek
    family: deepseek
    derived_from: gpt4o
    supports_json: true
    is_fallback_for: null
  - id: deepseek-reasoner
    provider: deepseek
    family: deepseek
    derived_from: gpt4o
    supports_json: true
    is_fallback_for: null

  # —— 千问 Qwen ——
